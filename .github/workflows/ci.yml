name: ci
on:
  push:
  pull_request:

jobs:
  # Proyecto Java: backend/ (Spring Boot) + frontend/ (plantillas). Las pruebas de integración levantan
  # PostgreSQL con Testcontainers (Docker viene instalado en los runners de GitHub).
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Pruebas (unitarias, modularidad, compatibilidad con legacy e integración)
        run: ./gradlew --no-daemon build
      - name: Documentación de módulos (Spring Modulith)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modulos
          path: backend/build/spring-modulith-docs
          if-no-files-found: ignore

  # Sistema anterior (Next.js) mientras dure la migración
  legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnoya
          POSTGRES_PASSWORD: turnoya
          POSTGRES_DB: turnoya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turnoya" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://turnoya:turnoya@localhost:5432/turnoya?schema=public
      TEST_DATABASE_URL: postgresql://turnoya:turnoya@localhost:5432/turnoya_test?schema=public
      JWT_SECRET: ci-secreto-de-pruebas-0123456789abcdef-0123
      DATA_ENCRYPTION_KEY: ci-clave-de-pruebas-0123456789abcdef-0123
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WHATSAPP_PROVIDER: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy/package-lock.json
      - run: npm ci
      - run: npm run db:generate -w backend
      - run: npm run typecheck
      - run: npm run lint
      - name: Pruebas unitarias (lógica pura de M1–M8)
        run: npm test
      - name: BD de pruebas
        run: npm run db:test:prepare
      - name: Pruebas de integración (concurrencia, aislamiento, regresión)
        run: npm run test:int
      - name: Build
        run: npm run build
        env:
          ALLOW_INSECURE_SECRETS: "true"
