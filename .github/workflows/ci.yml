name: ci
on:
  push:
  pull_request:

jobs:
  # Proyecto Java: backend/ (Spring Boot, aquí está Gradle) + frontend/ (plantillas). Las pruebas de integración levantan
  # PostgreSQL con Testcontainers (Docker viene instalado en los runners de GitHub).
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Pruebas (unitarias, modularidad, compatibilidad e integración)
        run: ./gradlew --no-daemon build
      - name: Documentación de módulos (Spring Modulith)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modulos
          path: backend/build/spring-modulith-docs
          if-no-files-found: ignore
