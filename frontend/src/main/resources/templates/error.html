<!DOCTYPE html>
<!--/* Página de error genérica de Spring Boot (500 y cualquier estado sin plantilla propia) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/base :: cabeza('Error')}"></head>
<body>
<main class="pagina-error">
  <div>
    <a th:replace="~{fragmentos/base :: logo('/', false)}"></a>
    <h1>Algo salió mal</h1>
    <p>Ocurrió un error inesperado. Inténtalo de nuevo en unos segundos.</p>
    <p class="ayuda" th:if="${requestId}" th:text="'Código de seguimiento: ' + ${requestId}"></p>
    <a class="boton" th:href="@{/}">Volver al inicio</a>
  </div>
</main>
</body>
</html>
