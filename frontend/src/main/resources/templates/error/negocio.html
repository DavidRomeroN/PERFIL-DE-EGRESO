<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/base :: cabeza('Aviso')}"></head>
<body>
<main class="pagina-error">
  <div>
    <a th:replace="~{fragmentos/base :: logo('/', false)}"></a>
    <h1 th:text="${status == 404} ? 'No lo encontramos' : 'No se pudo completar'">Aviso</h1>
    <p th:text="${mensaje}">Mensaje</p>
    <a class="boton" th:href="@{/}">Volver al inicio</a>
  </div>
</main>
</body>
</html>
